# Security scan configuration. Every skip needs a reason, and a review.
framework:
  - terraform
  - cloudformation
directory:
  - .
quiet: true
compact: true
skip-download: true

skip-check:
  # The billing bucket only ever holds AWS-generated export files. These
  # checks target general-purpose buckets, not this one.
  - CKV_AWS_18    # access logging: nothing but the AWS export service writes here
  - CKV_AWS_21    # versioning: exports use OVERWRITE_REPORT, versioning would only add storage cost
  - CKV_AWS_144   # cross-region replication: billing exports can be regenerated by AWS
  - CKV_AWS_145   # KMS CMK: default SSE-S3 encryption applies, a CMK would need extra key policy for the export service
  - CKV2_AWS_61   # lifecycle rules: retention is the customer's call, not ours
  - CKV2_AWS_62   # event notifications: no consumers in the customer's account