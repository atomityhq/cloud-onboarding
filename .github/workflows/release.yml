name: release

# Tag a cloud's version to publish it:  git tag aws-v1.0.0 && git push origin aws-v1.0.0
# That builds aws-v1.0.0.zip from the aws/ directory only (files at the zip root),
# with a checksum and a build-provenance attestation, and attaches them to a release.
on:
  push:
    tags:
      - "aws-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud and version from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-v*}"
          if [ ! -d "$cloud" ]; then
            echo "::error::Tag $tag has no matching directory '$cloud/'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Build the zip (tracked files of one cloud, at the zip root)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          git archive --format=zip --output="dist/${TAG}.zip" "${GITHUB_SHA}:${CLOUD}"
          (cd dist && sha256sum "${TAG}.zip" > "${TAG}.zip.sha256")
          unzip -l "dist/${TAG}.zip"
          if unzip -Z1 "dist/${TAG}.zip" | grep -E '\.tfstate|^terraform\.tfvars$|\.terraform/'; then
            echo "::error::Release zip contains files that must never ship"
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ steps.v.outputs.tag }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/${TAG}.zip" "dist/${TAG}.zip.sha256" \
            --title "$TAG" --generate-notes --verify-tag