name: release

# Each setup method is released on its own tag, because a customer uses only one:
#
#   Terraform       git tag aws-tf-v1.0.0      && git push origin aws-tf-v1.0.0
#   CloudFormation  git tag aws-cfn-v1.0.0     && git push origin aws-cfn-v1.0.0
#   Cloud Shell     git tag azure-shell-v1.0.0 && git push origin azure-shell-v1.0.0
#
# Terraform release:      aws-tf-v1.0.0.zip (the module, without cloudformation/ and
#                         cloud-shell/), a checksum and a build-provenance attestation.
# CloudFormation release: atomity.yaml (generated from <cloud>/cloudformation/),
#                         a checksum and a build-provenance attestation.
# Cloud Shell release:    atomity-azure.sh (built from <cloud>/cloud-shell/), a checksum and
#                         a build-provenance attestation. The script pins the Terraform
#                         releases listed in TERRAFORM_TAGS, runs the newest by default, and
#                         every one of them must already be published.
#
# AWS: both methods read the same shared files (policies/, focus_query.sql,
# member_role.yaml). A release warns when those changed since the other
# method's latest release, so one method does not fall behind unnoticed.
# Azure: the Cloud Shell script runs the released Terraform module, so there is
# nothing to keep in sync. Publishing a Terraform release opens a pull request that adds it
# to TERRAFORM_TAGS; merging it and tagging <cloud>-shell-v... ships it to Cloud Shell users.
on:
  push:
    tags:
      - "aws-tf-v[0-9]+.[0-9]+.[0-9]+"
      - "aws-cfn-v[0-9]+.[0-9]+.[0-9]+"
      - "azure-tf-v[0-9]+.[0-9]+.[0-9]+"
      - "azure-shell-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  terraform:
    if: ${{ contains(github.ref_name, '-tf-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # aws-tf-v1.0.0 -> aws (cloud names contain no hyphen)
          if [ ! -d "$cloud" ]; then
            echo "::error::Tag $tag has no matching directory '$cloud/'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Warn if CloudFormation is behind on shared files
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          other=$(git tag --list "${CLOUD}-cfn-v[0-9]*" --sort=-v:refname | head -n 1)
          if [ -n "$other" ] && ! git diff --quiet "$other" "$GITHUB_SHA" -- \
              "$CLOUD/policies" "$CLOUD/focus_query.sql" "$CLOUD/member_role.yaml"; then
            echo "::warning::Shared files changed since $other. Release CloudFormation too, or it keeps the old policies."
          fi

      - name: Build the zip (tracked files of one cloud, at the zip root, without cloudformation/ and cloud-shell/)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          git archive --format=zip --output="dist/${TAG}.zip" "${GITHUB_SHA}:${CLOUD}" -- . ':(exclude)cloudformation' ':(exclude)cloud-shell'
          (cd dist && sha256sum "${TAG}.zip" > "${TAG}.zip.sha256")
          unzip -l "dist/${TAG}.zip"
          if unzip -Z1 "dist/${TAG}.zip" | grep -E '\.tfstate|^terraform\.tfvars$|\.terraform/|^cloudformation/|^cloud-shell/'; then
            echo "::error::Release zip contains files that must never ship"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The module reads policies/*.json, member_role.yaml and focus_query.sql from
      # its own folder. Validate the extracted zip, not the repo, so a file that
      # the zip is missing fails here instead of on a customer's machine.
      - name: The zip alone must be a working module
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir verify
          unzip -q "dist/${TAG}.zip" -d verify
          cd verify
          terraform init -backend=false
          terraform validate

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ steps.v.outputs.tag }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          # notes cover changes since the previous Terraform release,
          prev=$(git tag --list "${CLOUD}-tf-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" "dist/${TAG}.zip" "dist/${TAG}.zip.sha256" \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  cloudformation:
    if: ${{ contains(github.ref_name, '-cfn-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # aws-cfn-v1.0.0 -> aws
          if [ ! -f "$cloud/cloudformation/atomity.yaml" ]; then
            echo "::error::Tag $tag has no template at '$cloud/cloudformation/atomity.yaml'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Warn if Terraform is behind on shared files
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          other=$(git tag --list "${CLOUD}-tf-v[0-9]*" --sort=-v:refname | head -n 1)
          if [ -n "$other" ] && ! git diff --quiet "$other" "$GITHUB_SHA" -- \
              "$CLOUD/policies" "$CLOUD/focus_query.sql" "$CLOUD/member_role.yaml"; then
            echo "::warning::Shared files changed since $other. Release Terraform too, or it keeps the old policies."
          fi

      # CI has already run build.py --check, so the committed template is current.
      - name: Collect the template
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          cp "${CLOUD}/cloudformation/atomity.yaml" dist/atomity.yaml
          (cd dist && sha256sum atomity.yaml > atomity.yaml.sha256)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atomity.yaml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-cfn-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" dist/atomity.yaml dist/atomity.yaml.sha256 \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  # The Cloud Shell script pins several Terraform releases and carries each one's checksum.
  # Before those checksums are stamped in, every pinned release is verified against its
  # published checksum and its build-provenance attestation, so a tampered release cannot be
  # pinned by accident.
  cloudshell:
    if: ${{ contains(github.ref_name, '-shell-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud and version from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # azure-shell-v1.0.0 -> azure
          if [ ! -f "$cloud/cloud-shell/build.py" ]; then
            echo "::error::Tag $tag has no script at '$cloud/cloud-shell/build.py'"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "cloud=$cloud"
            echo "version=${tag##*-v}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Verify every pinned Terraform release
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          pins=$(grep -vE '^[[:space:]]*(#|$)' "$CLOUD/cloud-shell/TERRAFORM_TAGS" | tr -d ' ' || true)
          if [ -z "$pins" ]; then
            echo "::error::$CLOUD/cloud-shell/TERRAFORM_TAGS lists no releases"
            exit 1
          fi
          for pin in $pins; do
            case "$pin" in
              "${CLOUD}-tf-v"[0-9]*) ;;
              *) echo "::error::TERRAFORM_TAGS must list ${CLOUD}-tf releases, got '$pin'"; exit 1 ;;
            esac
            echo "::group::$pin"
            gh release download "$pin" --pattern "${pin}.zip" --pattern "${pin}.zip.sha256" --dir "tf/${pin}"
            (cd "tf/${pin}" && sha256sum -c "${pin}.zip.sha256")
            gh attestation verify "tf/${pin}/${pin}.zip" --repo "$GITHUB_REPOSITORY"
            echo "::endgroup::"
          done
          echo "pins=$(echo "$pins" | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Build the script (stamps the version and the verified checksums)
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
          VERSION: ${{ steps.v.outputs.version }}
          PINS: ${{ steps.pin.outputs.pins }}
        run: |
          zips=()
          for pin in ${PINS//,/ }; do zips+=(--zip "${pin}=tf/${pin}/${pin}.zip"); done
          python3 "$CLOUD/cloud-shell/build.py" --version "$VERSION" --tf-tags "$PINS" "${zips[@]}" --out "$PWD/dist"

      - name: The built script must be complete and self-consistent
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PINS: ${{ steps.pin.outputs.pins }}
        run: |
          if grep -E '@@(SCRIPT_VERSION|PINNED_MODULES)@@' dist/atomity-azure.sh; then
            echo "::error::placeholders were left in the built script"
            exit 1
          fi
          shellcheck dist/atomity-azure.sh
          (cd dist && sha256sum -c atomity-azure.sh.sha256)
          bash dist/atomity-azure.sh --version | tee version.txt
          grep -F "atomity-azure.sh ${VERSION} (default Terraform module" version.txt
          for pin in ${PINS//,/ }; do grep -F "$pin" version.txt; done

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atomity-azure.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-shell-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" dist/atomity-azure.sh dist/atomity-azure.sh.sha256 \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  # After a Terraform release is published, open a pull request that adds it to the Cloud
  # Shell script's pins. Merging it and tagging <cloud>-shell-vX.Y.Z ships it to Cloud Shell
  # users: the script runs the newest pinned release by default. Close the pull request if the
  # release was only a test.
  #
  # A pull request opened with the default token does not start CI, so a required check would
  # never run. Set a PIN_BUMP_TOKEN secret (a fine-grained token or GitHub App token with
  # contents and pull-requests write) so CI runs on it. Without the secret this still works,
  # but the pull request needs a close and reopen to start CI, and the repository setting
  # "Allow GitHub Actions to create and approve pull requests" must be on.
  bump-pin:
    if: ${{ contains(github.ref_name, '-tf-') }}
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PIN_BUMP_TOKEN || github.token }}

      - name: Add the release to the Cloud Shell pins and open a pull request
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cloud="${TAG%%-*}" # azure-tf-v1.1.0 -> azure
          file="$cloud/cloud-shell/TERRAFORM_TAGS"
          if [ ! -f "$file" ]; then
            echo "$cloud has no Cloud Shell script, so there is nothing to pin."
            exit 0
          fi
          if grep -qx "$TAG" "$file"; then
            echo "$TAG is already pinned."
            exit 0
          fi
          branch="bump-pin/$TAG"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            echo "The branch $branch already exists, so a pull request was already opened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # keep the comment lines, add the tag, and keep the tags newest first by version
          {
            grep -E '^[[:space:]]*#' "$file" || true
            { grep -vE '^[[:space:]]*(#|$)' "$file" || true; echo "$TAG"; } | sort -rVu
          } > "$file.new"
          mv "$file.new" "$file"
          git add "$file"
          git commit -m "Pin $TAG in the Cloud Shell script"
          git push origin "$branch"
          body="Adds \`$TAG\` to \`$file\`.

          The Cloud Shell script runs the newest pinned release by default, and every older pin stays selectable with \`--module-tag\`. To ship this release to Cloud Shell users, merge this and tag \`${cloud}-shell-vX.Y.Z\`. The release job verifies each pinned release's checksum and attestation before building.

          Remove a pin you no longer want to ship by deleting its line. Close this pull request if \`$TAG\` was only a test release."
          gh pr create --base main --head "$branch" --title "Pin $TAG in the Cloud Shell script" --body "$body"