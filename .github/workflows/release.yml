name: release

# Each setup method is released on its own tag, because a customer uses only one:
#
#   Terraform       git tag aws-tf-v1.0.0      && git push origin aws-tf-v1.0.0
#   CloudFormation  git tag aws-cfn-v1.0.0     && git push origin aws-cfn-v1.0.0
#   Cloud Shell     git tag azure-shell-v1.0.0 && git push origin azure-shell-v1.0.0
#   Bicep / ARM     git tag azure-bicep-v1.0.0 && git push origin azure-bicep-v1.0.0
#
# Terraform release:      aws-tf-v1.0.0.zip (the module, without cloudformation/,
#                         cloud-shell/ and bicep/), a checksum and a build-provenance attestation.
# CloudFormation release: atomity.yaml (generated from <cloud>/cloudformation/),
#                         a checksum and a build-provenance attestation.
# Cloud Shell release:    atomity-azure.sh (built from <cloud>/cloud-shell/), a checksum and
#                         a build-provenance attestation.
# Bicep / ARM release:    atomity.json (compiled from <cloud>/bicep/), modules zip,
#                         a checksum and a build-provenance attestation.
on:
  push:
    tags:
      - "aws-tf-v[0-9]+.[0-9]+.[0-9]+"
      - "aws-cfn-v[0-9]+.[0-9]+.[0-9]+"
      - "azure-tf-v[0-9]+.[0-9]+.[0-9]+"
      - "azure-shell-v[0-9]+.[0-9]+.[0-9]+"
      - "azure-bicep-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  terraform:
    if: ${{ contains(github.ref_name, '-tf-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # aws-tf-v1.0.0 -> aws (cloud names contain no hyphen)
          if [ ! -d "$cloud" ]; then
            echo "::error::Tag $tag has no matching directory '$cloud/'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Warn if CloudFormation is behind on shared files
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          other=$(git tag --list "${CLOUD}-cfn-v[0-9]*" --sort=-v:refname | head -n 1)
          if [ -n "$other" ] && ! git diff --quiet "$other" "$GITHUB_SHA" -- \
              "$CLOUD/policies" "$CLOUD/focus_query.sql" "$CLOUD/member_role.yaml"; then
            echo "::warning::Shared files changed since $other. Release CloudFormation too, or it keeps the old policies."
          fi

      - name: Build the zip (tracked files of one cloud, at the zip root, without cloudformation/, cloud-shell/ and bicep/)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          git archive --format=zip --output="dist/${TAG}.zip" "${GITHUB_SHA}:${CLOUD}" -- . ':(exclude)cloudformation' ':(exclude)cloud-shell' ':(exclude)bicep'
          (cd dist && sha256sum "${TAG}.zip" > "${TAG}.zip.sha256")
          unzip -l "dist/${TAG}.zip"
          if unzip -Z1 "dist/${TAG}.zip" | grep -E '\.tfstate|^terraform\.tfvars$|\.terraform/|^cloudformation/|^cloud-shell/|^bicep/'; then
            echo "::error::Release zip contains files that must never ship"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: The zip alone must be a working module
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir verify
          unzip -q "dist/${TAG}.zip" -d verify
          cd verify
          terraform init -backend=false
          terraform validate

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ steps.v.outputs.tag }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-tf-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" "dist/${TAG}.zip" "dist/${TAG}.zip.sha256" \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  cloudformation:
    if: ${{ contains(github.ref_name, '-cfn-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # aws-cfn-v1.0.0 -> aws
          if [ ! -f "$cloud/cloudformation/atomity.yaml" ]; then
            echo "::error::Tag $tag has no template at '$cloud/cloudformation/atomity.yaml'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Warn if Terraform is behind on shared files
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          other=$(git tag --list "${CLOUD}-tf-v[0-9]*" --sort=-v:refname | head -n 1)
          if [ -n "$other" ] && ! git diff --quiet "$other" "$GITHUB_SHA" -- \
              "$CLOUD/policies" "$CLOUD/focus_query.sql" "$CLOUD/member_role.yaml"; then
            echo "::warning::Shared files changed since $other. Release Terraform too, or it keeps the old policies."
          fi

      - name: Collect the template
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          cp "${CLOUD}/cloudformation/atomity.yaml" dist/atomity.yaml
          (cd dist && sha256sum atomity.yaml > atomity.yaml.sha256)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atomity.yaml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-cfn-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" dist/atomity.yaml dist/atomity.yaml.sha256 \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  shell:
    if: ${{ contains(github.ref_name, '-shell-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud and version from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # azure-shell-v1.0.0 -> azure
          version="${tag##*-}" # azure-shell-v1.0.0 -> v1.0.0
          if [ ! -d "$cloud/cloud-shell" ]; then
            echo "::error::Tag $tag has no matching directory '$cloud/cloud-shell/'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Read pinned Terraform releases from TERRAFORM_TAGS
        id: pin
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          pins=$(grep -vE '^[[:space:]]*(#|$)' "$CLOUD/cloud-shell/TERRAFORM_TAGS" | tr '\n' ',' | sed 's/,$//')
          if [ -z "$pins" ]; then
            echo "::error::$CLOUD/cloud-shell/TERRAFORM_TAGS contains no pins"
            exit 1
          fi
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

      - name: Download each pinned Terraform release archive and its checksum
        env:
          PINS: ${{ steps.pin.outputs.pins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for pin in ${PINS//,/ }; do
            mkdir -p "tf/$pin"
            gh release download "$pin" --pattern "${pin}.zip*" --dir "tf/$pin"
            (cd "tf/$pin" && sha256sum -c "${pin}.zip.sha256")
            gh attestation verify "tf/$pin/${pin}.zip" --repo "$GITHUB_REPOSITORY"
          done

      - name: Build the script
        env:
          CLOUD: ${{ steps.v.outputs.cloud }}
          VERSION: ${{ steps.v.outputs.version }}
          PINS: ${{ steps.pin.outputs.pins }}
        run: |
          zips=()
          for pin in ${PINS//,/ }; do zips+=(--zip "${pin}=tf/${pin}/${pin}.zip"); done
          python3 "$CLOUD/cloud-shell/build.py" --version "$VERSION" --tf-tags "$PINS" "${zips[@]}" --out "$PWD/dist"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atomity-azure.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-shell-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" dist/atomity-azure.sh dist/atomity-azure.sh.sha256 \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  bicep:
    if: ${{ contains(github.ref_name, '-bicep-') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cloud from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          cloud="${tag%%-*}" # azure-bicep-v1.0.0 -> azure
          if [ ! -f "$cloud/bicep/atomity.json" ]; then
            echo "::error::Tag $tag has no template at '$cloud/bicep/atomity.json'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Collect release artifacts (atomity.json and bicep zip)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          mkdir dist
          cp "${CLOUD}/bicep/atomity.json" dist/atomity.json
          git archive --format=zip --output="dist/${TAG}-modules.zip" "${GITHUB_SHA}:${CLOUD}/bicep"
          (cd dist && sha256sum atomity.json > atomity.json.sha256)
          (cd dist && sha256sum "${TAG}-modules.zip" > "${TAG}-modules.zip.sha256")

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          CLOUD: ${{ steps.v.outputs.cloud }}
        run: |
          prev=$(git tag --list "${CLOUD}-bicep-v[0-9]*" --sort=-v:refname | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}')
          gh release create "$TAG" dist/atomity.json dist/atomity.json.sha256 "dist/${TAG}-modules.zip" "dist/${TAG}-modules.zip.sha256" \
            --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"} --verify-tag

  bump-pin:
    if: ${{ contains(github.ref_name, '-tf-') }}
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PIN_BUMP_TOKEN || github.token }}

      - name: Add the release to the Cloud Shell pins and open a pull request
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cloud="${TAG%%-*}"
          file="$cloud/cloud-shell/TERRAFORM_TAGS"
          if [ ! -f "$file" ]; then
            exit 0
          fi
          if grep -qx "$TAG" "$file"; then
            exit 0
          fi
          branch="bump-pin/$TAG"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          {
            grep -E '^[[:space:]]*#' "$file" || true
            { grep -vE '^[[:space:]]*(#|$)' "$file" || true; echo "$TAG"; } | sort -rVu
          } > "$file.new"
          mv "$file.new" "$file"
          git add "$file"
          git commit -m "Pin $TAG in the Cloud Shell script"
          git push origin "$branch"
          body="Adds \`$TAG\` to \`$file\`."
          gh pr create --base main --head "$branch" --title "Pin $TAG in the Cloud Shell script" --body "$body"