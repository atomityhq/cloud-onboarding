name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # also called by release.yml, so a tag can't ship without a green CI run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  # Finds every cloud directory (aws/, azure/, gcp/ ...) that contains a
  # versions.tf, so a new cloud is picked up by every job below automatically.
  discover:
    name: discover modules
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          dirs=$(find . -mindepth 2 -maxdepth 2 -name versions.tf -not -path './.git/*' -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Modules: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  hygiene:
    name: repo hygiene
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No state, tfvars or provider caches in git
        run: |
          bad=$(git ls-files | grep -E '(\.tfstate|(^|/)terraform\.tfvars$|(^|/)\.terraform/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must never be committed:"
            echo "$bad"
            exit 1
          fi
      - name: Every module has the files customers and the wizard rely on
        env:
          DIRS: ${{ needs.discover.outputs.dirs }}
        run: |
          fail=0
          for d in $(echo "$DIRS" | jq -r '.[]'); do
            for f in versions.tf variables.tf outputs.tf terraform.tfvars.example README.md; do
              if [ ! -f "$d/$f" ]; then
                echo "::error::$d/$f is missing"
                fail=1
              fi
            done
          done
          exit $fail

  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  # Runs on the oldest Terraform we claim to support (required_version) and on
  # the latest, so neither claim can quietly stop being true.
  validate:
    name: validate ${{ matrix.dir }} (terraform ${{ matrix.terraform }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
        terraform: ["1.5.7", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: init and validate
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f .terraform.lock.hcl ]; then
            terraform init -backend=false -lockfile=readonly
          else
            terraform init -backend=false
          fi
          terraform validate

  tflint:
    name: tflint ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
          github_token: ${{ github.token }}
          cache: true
          tflint_config_path: .tflint.hcl
      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - name: install rulesets
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids the anonymous API rate limit
        run: tflint --init
      - name: lint
        env:
          DIR: ${{ matrix.dir }}
        run: tflint --chdir="$DIR" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  # CloudFormation templates. <cloud>/cloudformation/atomity.yaml is generated
  # from atomity.src.yaml and the shared files (policies, focus_query.sql,
  # member_role.yaml), so first check it is up to date, then lint every template.
  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.60.0 pyyaml # pyyaml: build.py checks member_role.yaml for policy drift
      - name: Generated templates are up to date and member role matches shared policies
        run: |
          fail=0
          for b in $(git ls-files '*/cloudformation/build.py'); do
            python3 "$b" --check || fail=1
          done
          exit $fail
      - name: Lint templates
        run: |
          # *.src.yaml has build markers and is not valid CloudFormation on its own
          files=$(git ls-files '*/cloudformation/*.yaml' '*/member_role.yaml' | grep -v '\.src\.yaml$' || true)
          if [ -z "$files" ]; then
            echo "::error::no CloudFormation templates found"
            exit 1
          fi
          echo "$files"
          cfn-lint $files

  # CDK users deploy the released CloudFormation template by importing it with CfnInclude.
  # This proves the committed atomity.yaml still imports and synthesizes, so we can keep
  # promising CDK support without maintaining a CDK package.
  cdk-compat:
    name: cdk compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import each template through CDK
        run: |
          pkgs=$(git ls-files '*/cloudformation/cdk-test/package.json')
          if [ -z "$pkgs" ]; then
            echo "::error::no CDK compatibility test found"
            exit 1
          fi
          fail=0
          for pkg in $pkgs; do
            (cd "$(dirname "$pkg")" && npm ci --no-audit --no-fund && npm test) || fail=1
          done
          exit $fail

  # Cloud Shell scripts (<cloud>/cloud-shell/). The script is a thin wrapper around the
  # released Terraform module, so these tests run it against a mock az and terraform. They
  # prove the script's own logic (validation, checksums, plan and confirm, apply, remove),
  # not the module itself. The module is covered by the validate and tflint jobs above.
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck, build script and behaviour tests
        run: |
          tests=$(git ls-files '*/cloud-shell/test.sh')
          if [ -z "$tests" ]; then
            echo "::error::no Cloud Shell tests found"
            exit 1
          fi
          fail=0
          for t in $tests; do
            d=$(dirname "$t")
            echo "::group::$d"
            shellcheck "$d"/*.sh || fail=1
            python3 -m py_compile "$d/build.py" || fail=1
            # the pins must be Terraform release tags of the same cloud, listed once each
            cloud=$(dirname "$d")
            pins=$(grep -vE '^[[:space:]]*(#|$)' "$d/TERRAFORM_TAGS" || true)
            if [ -z "$pins" ]; then
              echo "::error::$d/TERRAFORM_TAGS must list at least one tag like ${cloud}-tf-v1.0.0"
              fail=1
            else
              if echo "$pins" | grep -Evx "${cloud}-tf-v[0-9]+\.[0-9]+\.[0-9]+"; then
                echo "::error::$d/TERRAFORM_TAGS has lines that are not ${cloud}-tf-vX.Y.Z tags (shown above)"
                fail=1
              fi
              if [ -n "$(echo "$pins" | sort | uniq -d)" ]; then
                echo "::error::$d/TERRAFORM_TAGS lists a tag more than once"
                fail=1
              fi
            fi
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  checkov:
    name: security scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.3
      - run: checkov --config-file .checkov.yaml

  # One stable name to mark as a required check in branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [hygiene, fmt, validate, tflint, cfn-lint, cdk-compat, shell, checkov]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac